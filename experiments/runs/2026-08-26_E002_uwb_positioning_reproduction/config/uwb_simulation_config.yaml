# Simulation-baseline UWB anchor configuration for the NEXUS sandbox.
# These positions are geometric assumptions, not measured field values.
anchors:
  - {id: A1, position_m: [0.30, 0.30, 2.20]}
  - {id: A2, position_m: [3.70, 0.30, 2.20]}
  - {id: A3, position_m: [3.70, 4.40, 2.20]}
  - {id: A4, position_m: [0.30, 4.40, 2.20]}

range_noise:
  distribution: gaussian
  mean_m: 0.0
  # Default noise level; experiment runner may override.
  sigma_m: 0.0
  random_seed: 42
