schema_version: 1
calibration_id: live_approximate_user_accepted_20260908
calibration_status: experimental_approximation
map_frame: map
body_frame: base_link
approximations:
- 'User authorized approximate lever arm: tag_body_m=[0,0,0], not surveyed.'
- Bias random-walk values retain existing model defaults; long-run random walk is
  not measured.
- Initial map yaw uses vendor sign convention plus existing 9-degree map offset; absolute
  heading accuracy unverified.
- Tag height 0.12-0.14 m was an initial operator estimate, later explicitly uncertain;
  replay seed z=0.13 m is not ground truth.
- Resting tag is assumed below overhead anchors; range solve constrains tag z to 0..2.5
  m.
- Camera translation is a collocated approximation, not surveyed.
- Moving initialization uses current FC bridge attitude plus 9-degree map yaw and
  current raw UWB ranges; initial velocity is unknown with 1 m/s prior sigma.
- IMU bias prior comes from E047 current_static_bias.json; motion is never treated
  as a new stationary bias calibration.
