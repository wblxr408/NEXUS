schema_version: 2
configuration_id: raspberry_pi_tag2_user_v02
source: user_photos_2026-09-04_with_tag_id_override
verification_status: user_confirmed_field_measured
application_policy: record_only_never_write_to_flight_controller

uwb:
  calibration_status: measured
  calibration_source: user_confirmed_field_measurement
  coordinate_uncertainty: not_separately_provided
  tag_id: 2
  tag_total: 1
  provided_coordinate_unit: cm
  range_slot_anchor_ids: ["1", "2", "3", "4"]
  anchors_map_cm:
    "1": [90.0, -90.0, 256.0]
    "2": [0.0, 500.0, 271.0]
    "3": [400.0, 500.0, 271.0]
    "4": [400.0, 0.0, 271.0]
  anchors_map_m:
    "1": [0.90, -0.90, 2.56]
    "2": [0.00, 5.00, 2.71]
    "3": [4.00, 5.00, 2.71]
    "4": [4.00, 0.00, 2.71]
  range_variance_m2: [0.0025, 0.0025, 0.0025, 0.0025]

map:
  yaw_offset_deg: 9.0

camera:
  model: IMX219
  mounting: bottom_lens_down
  rotation_deg: 180
  width: 1640
  height: 1232
  fps: 30.0
  calibration_status: deferred_by_user

