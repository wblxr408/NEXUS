schema_version: 1
chain: chain_d_online_visual
description: Online bounded visual-inertial-ranging target localization.
factors:
  # RRD is bbox-only: F2/F4 remain available in the solver but are not enabled
  # until target meshes or surveyed control points are present.
  enabled: [F1, F3, F5, F6, F7, F8]
  weights: {F1: 1.0, F3: 1.0, F5: 0.8, F6: 0.8, F7: 0.35, F8: 0.10}
solver:
  method: trf
  loss: huber
  f_scale: 1.0
  max_nfev: 30
  outlier_sigma: 3.0
  second_pass: false
  optimize_camera_poses: true
  optimize_segment_alignment: true
  stages: []
gates:
  minimum_views: 3
  minimum_baseline_m: 0.10
output:
  source_mode: SOURCE_PLATFORM_RELATIVE
  invalid_policy: publish_nan_with_reason
  network_depth_allowed: false
  update_budget_ms: 100.0
