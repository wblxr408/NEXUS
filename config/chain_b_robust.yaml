schema_version: 1
chain: chain_b_robust
description: Degradation-first bundle with conservative channel-consistency rejection.
factors:
  enabled: [F1, F2, F3, F4, F5, F6, F7, F8]
  weights: {F1: 0.65, F2: 0.45, F3: 1.5, F4: 1.5, F5: 0.8, F6: 1.0, F7: 0.35, F8: 0.15}
solver:
  method: trf
  loss: huber
  f_scale: 1.0
  max_nfev: 240
  outlier_sigma: 2.5
  second_pass: true
  optimize_camera_poses: true
  optimize_segment_alignment: true
gates:
  minimum_views: 2
  minimum_baseline_m: 0.05
  hard_channel_disagreement_m: 0.30
  hard_uwb_residual_m: 0.50
output:
  source_mode: SOURCE_FUSED
  invalid_policy: publish_nan_with_reason
  network_depth_allowed: false
