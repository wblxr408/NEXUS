schema_version: 1
chain: chain_a_precision
description: Precision-first batch bundle; depth comes from geometry, never network z.
factors:
  enabled: [F1, F2, F3, F4, F5, F6, F7, F8]
  weights: {F1: 1.0, F2: 1.0, F3: 1.0, F4: 1.0, F5: 0.8, F6: 0.5, F7: 0.15, F8: 0.08}
solver:
  method: trf
  loss: soft_l1
  f_scale: 1.0
  max_nfev: 240
  outlier_sigma: 3.0
  second_pass: true
  optimize_camera_poses: true
  optimize_segment_alignment: true
gates:
  minimum_views: 3
  minimum_baseline_m: 0.10
output:
  source_mode: SOURCE_PLATFORM_RELATIVE
  invalid_policy: publish_nan_with_reason
  network_depth_allowed: false
