# Ten parameterised stand-ins for the fixed sandbox targets.  No surveyed CAD
# exists yet: dimensions and decorative geometry are a simulation design, not
# physical ground truth for the real sandbox.
#
# `symmetry` is the structured group ruled by ADR-009 (the earlier flat
# `symmetry: none` was wrong for eight of ten targets).  `label` keeps the
# human-readable legacy string for older consumers; `continuous_axes` and
# `discrete_folds` are expanded into BOP `symmetries_continuous` /
# `symmetries_discrete` by generate_target_detection_dataset.py.  Axes are unit
# vectors in target_link.  `decoration` is rendered as face colour only and is
# never added to the model mesh, so the mesh stays consistent with this group.
#
# `base_z_mm` is the object base elevation in map (position_z - size_z/2).  The
# sandbox deck is at 50 mm, so nine of ten targets sit 5-20 mm below it: the F3
# support-plane factor must read this field instead of assuming z_base = deck.
catalog_id: nexus_sandbox_distinct_targets_v01
unit: mm
coordinate_frame: map
origin_definition: target_link at each object's geometric reference centre
source: designed_parameterized_proxy_without_cad
dimension_confidence: C
symmetry_authority: docs/decisions/2026-08-29_ADR-009_markerless_depth_channel_and_symmetry.md
support_deck_z_mm: 50.0
targets:
  - {object_id: 1, class_name: vertical_striped_tank, source_object_id: NW-T01, shape: cylinder, position_mm: [1320, 3080, 115], size_mm: [190, 190, 130], base_z_mm: 50.0, yaw_deg: 10, color_rgb: [197, 72, 56], decoration: vertical_stripes, symmetry: {label: continuous_z, continuous_axes: [[0, 0, 1]], discrete_folds: []}}
