# 外围是一圈连续双向双车道环路；四个角点为十字路口。核心内部仅由
# 一条东西向和一条南北向单车道切分四块工业岛。工业岛边界直接贴住核心
# 边界道路，不再生成工业岛周边绿化树环。
roads:
  # 外周道路吸收原内圈矩形道路的宽度：每条为双向双车道。
  - {id: RD-RING-W, type: perimeter_ns, center: [500, 2350], size: [600, 5200], height: 2, confidence: C}
  - {id: RD-RING-E, type: perimeter_ns, center: [3500, 2350], size: [600, 5200], height: 2, confidence: C}
  - {id: RD-RING-S, type: perimeter_ew, center: [2000, 500], size: [4400, 600], height: 2, confidence: C}
  - {id: RD-RING-N, type: perimeter_ew, center: [2000, 4200], size: [4400, 600], height: 2, confidence: C}
  # 横向单车道延伸到左右环路，和外围道路形成两个十字交叉；纵向单车道只分割核心岛。
  - {id: RD-C-X, type: central_single_lane_ew, center: [2000, 2350], size: [3000, 180], height: 2, confidence: B}
